<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FCFBF8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f0f" />
    <meta name="application-name" content="%LENT_APP_NAME%" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%LENT_APP_NAME%" />
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
    <meta name="googlebot" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
    <title>%LENT_SEO_TITLE%</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="%LENT_SEO_TITLE%" />
    <meta
      name="description"
      content="%LENT_SEO_DESCRIPTION%"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="%LENT_APP_NAME%" />
    <meta property="og:url" content="/" />
    <meta property="og:title" content="%LENT_SEO_TITLE%" />
    <meta
      property="og:description"
      content="%LENT_SEO_DESCRIPTION%"
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:alt" content="Aperçu de l'application %LENT_APP_NAME%" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="/" />
    <meta name="twitter:title" content="%LENT_SEO_TITLE%" />
    <meta
      name="twitter:description"
      content="%LENT_SEO_DESCRIPTION%"
    />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="Aperçu de l'application %LENT_APP_NAME%" />

    <script type="application/ld+json" id="seo-structured-data">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "%LENT_APP_NAME%",
        "headline": "%LENT_SEO_TITLE%",
        "description": "%LENT_SEO_DESCRIPTION%",
        "applicationCategory": "EducationApplication",
        "operatingSystem": "Any",
        "inLanguage": "fr-FR",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "EUR"
        },
        "sameAs": ["%LENT_REPO_URL%"],
        "featureList": [
          "Consulter ses notes et résultats",
          "Retrouver son emploi du temps ADE",
          "Accéder aux services universitaires depuis une interface unique",
          "Installer l'application en PWA sur mobile et ordinateur"
        ]
      }
    </script>

    <style>
      :root {
        color-scheme: light dark;
      }

      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f3ed;
        color: #341200;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #0f0f0f;
          color: #f3ede8;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="margin:0;padding:24px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
        JavaScript est nécessaire pour utiliser l&apos;application.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
