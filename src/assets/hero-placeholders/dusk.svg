      <stop offset="0" stop-color="#9ec5e8"/>
      <stop offset="0.6" stop-color="#f3d9b8"/>
      <stop offset="1" stop-color="#f7c99a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.62" r="0.38">
      <stop offset="0" stop-color="#fff4d6" stop-opacity="0.9"/>
